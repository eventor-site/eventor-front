name: Eventor Front Deploy

# trendist-front 와 같은 방식: 정적 파일(dist)만 서버 폴더에 올리고 nginx 가 서빙한다(도커 없음).
# 서버 폴더: /home/ubuntu/content/eventor/releases
#   - nginx: 기존 ./content:/var/www 마운트로 /var/www/eventor/releases
#   - 백엔드(SEO HTML): 상위 폴더 /home/ubuntu/content/eventor 를 /app/web 으로 마운트해 releases/index.html 을 읽는다
#     (상위 폴더를 마운트하므로 releases 를 지웠다 다시 만들어도 컨테이너가 새 폴더를 본다)
# trendist 와 다른 점
#   - Node 버전: .nvmrc(26). React Router 8 이 Node 22.22 이상을 요구한다
#   - 이전 빌드의 assets 를 한 세대 남긴다: 배포 순간 화면을 열어 둔 사람이 에디터·관리자 화면(따로 받는 파일)을 열 때 404 가 나지 않게

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 타입 검사 후 빌드
      - name: Build Vite app
        run: npm run build

      - name: Upload build to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/eventor-build"
          strip_components: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy release
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            RELEASE_PATH=/home/ubuntu/content/eventor/releases
            MANIFEST=/home/ubuntu/content/eventor/.assets-current
            PREV_ASSETS=/tmp/eventor-prev-assets
            # 직전 빌드가 만든 assets 만(목록 파일 기준) 잠시 옮겨 둔다 → 한 세대만 남고 쌓이지 않는다
            rm -rf $PREV_ASSETS
            mkdir -p $PREV_ASSETS
            if [ -f $MANIFEST ] && [ -d $RELEASE_PATH/assets ]; then
              while read -r f; do [ -f "$RELEASE_PATH/assets/$f" ] && cp -p "$RELEASE_PATH/assets/$f" $PREV_ASSETS/; done < $MANIFEST
            fi
            rm -rf $RELEASE_PATH
            mkdir -p $RELEASE_PATH
            mv /tmp/eventor-build/* $RELEASE_PATH/
            rm -rf /tmp/eventor-build
            ls $RELEASE_PATH/assets > $MANIFEST
            # 이름에 내용 해시가 붙어 있어 같은 이름이면 같은 파일이다(덮어써도 무방)
            cp -p $PREV_ASSETS/* $RELEASE_PATH/assets/ 2>/dev/null
            rm -rf $PREV_ASSETS
            chmod -R 755 $RELEASE_PATH
            docker exec nginx nginx -s reload
