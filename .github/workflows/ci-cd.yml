name: Eventor Front Deploy

# 프론트는 정적 파일(dist)만 서버 폴더에 올리고 nginx 가 서빙한다(도커 없음, trendist 와 같은 방식).
# 서버 폴더: /home/ubuntu/content/eventor/releases  (nginx 컨테이너에 읽기 전용 마운트, 백엔드 컨테이너에도 ./web 으로 마운트)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 타입 검사 후 빌드
      - name: Build
        run: npm run build

      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/tmp/eventor-front-build"
          strip_components: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      # releases 폴더는 nginx·백엔드 컨테이너가 바인드 마운트하므로 폴더를 지우거나 이름을 바꾸지 않고 안의 파일만 바꾼다
      # (폴더를 바꾸면 컨테이너는 예전 폴더를 계속 본다).
      # --delay-updates: 파일을 다 받은 뒤 한꺼번에 교체 → 배포 중 반쯤 바뀐 화면이 보이지 않는다.
      # 이전 빌드의 해시 파일(assets/*)은 지우지 않아 열려 있던 화면이 깨지지 않게 하고, 7일 지난 것만 정리한다.
      - name: Deploy release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            RELEASE=/home/ubuntu/content/eventor/releases
            mkdir -p $RELEASE
            rsync -a --delay-updates /tmp/eventor-front-build/ $RELEASE/
            rm -rf /tmp/eventor-front-build
            find $RELEASE/assets -type f -mtime +7 -delete 2>/dev/null || true
            chmod -R a+rX $RELEASE
            docker exec nginx nginx -s reload
